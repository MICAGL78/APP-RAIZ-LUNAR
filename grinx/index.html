],articles:[

 ['La Júlia té un gos que es diu Roc. Com es diu el gos?','Roc',['Roc','Júlia','Pau']],['Cada matí, Marc va a escola caminant. Com hi va?','caminant',['en autobús','caminant','en bicicleta']],['La mestra posa tres llibres damunt la taula. Quants llibres hi ha?','tres',['dos','tres','quatre']],['Aina porta una motxilla roja. De quin color és?','roja',['blava','verda','roja']],['Diumenge, Anna visita els iaios. Quan els visita?','diumenge',['dilluns','diumenge','dijous']],['El gat dorm baix de la cadira. On dorm?','baix de la cadira',['damunt la taula','baix de la cadira','al jardí']],['Hui plou i Laia agafa el paraigua. Per què l’agafa?','perquè plou',['perquè fa sol','perquè plou','perquè neva']],['L’avi planta tomaques a l’hort. Què planta?','tomaques',['arbres','tomaques','flors']]

// Avoid semantically ambiguous multiple-choice antonyms.
B.contraris=B.contraris.filter(x=>x[3]!=='a');
colors.forEach(([v,es],i)=>B.classe.push([`Com es diu «${es}» en valencià?`,v,[v,colors[(i+4)%colors.length][0],colors[(i+7)%colors.length][0]]]));
classroom.forEach(([v,es],i)=>B.classe.push([`Com es diu «${es}» en valencià?`,v,[classroom[(i+5)%classroom.length][0],v,classroom[(i+9)%classroom.length][0]]]));
days.forEach((d,i)=>{B.dies.push([`Quin dia va després de «${d}»?`,days[(i+1)%7],[days[(i+2)%7],days[(i+1)%7],days[(i+6)%7]]]);B.dies.push([`Escriu el dia ${i+1} de la setmana.`,d,[],null,'write'])});
months.forEach((m,i)=>{B.mesos.push([`Quin mes va després de «${m}»?`,months[(i+1)%12],[months[(i+1)%12],months[(i+2)%12],months[(i+11)%12]]]);B.mesos.push([`Escriu el mes número ${i+1}.`,m,[],null,'write'])});
const STORAGE='grinx-valencia-v1';let saved;try{saved=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{saved={}};let state={stars:saved.stars||0,done:saved.done||{},mistakes:saved.mistakes||{},coffers:saved.coffers||0,badges:saved.badges||[],screen:'home',world:null,session:null,mode:'mixed',hand:false,choice:null,typed:'',revealed:false,answered:false,correct:false,strokes:[]};
const $=s=>document.querySelector(s), escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){localStorage.setItem(STORAGE,JSON.stringify({stars:state.stars,done:state.done,mistakes:state.mistakes,coffers:state.coffers,badges:state.badges}))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function tag(x){return W.find(w=>w.id===x)?.name||'Repàs'}
function home(){let finished=Object.values(state.done).reduce((a,b)=>a+b,0);return `<div class="hero"><h1>Recuperem les paraules!</h1><p>El Grinx les ha amagat. Supera missions, escriu conjurs i obri cofres secrets.</p><div class="mascot">👹</div></div><div class="reward"><div class="emoji">🎁</div><div><b>${state.coffers?state.coffers+' cofres oberts':'El teu primer cofre t’espera!'}</b><div class="subtle">Cada 30 estrelles guanyes un cofre misteriós.</div></div></div><h2 class="section">Tria una missió</h2><div class="worlds">${W.map(w=>`<button class="world" onclick="openWorld('${w.id}')"><div class="emoji">${w.icon}</div><h3>${w.name}</h3><p>${w.desc}</p><div class="meter"><div class="fill" style="width:${Math.min(100,(state.done[w.id]||0)*20)}%"></div></div><div class="tiny" style="color:#607d6c;margin-top:6px">${state.done[w.id]||0} missions superades</div></button>`).join('')}</div><h2 class="section">Repàs especial</h2><button class="btn gold wide" onclick="startExam()">🏆 Simulacre d’examen · 20 preguntes</button><p class="notice">El teu progrés es guarda en aquest dispositiu, mentre no s'esborren les dades del navegador.</p>`}
function world(){let w=W.find(x=>x.id===state.world);return `<button class="back" onclick="go('home')">← Tornar al mapa</button><div style="font-size:60px;margin:20px 0 0">${w.icon}</div><h1 style="margin:5px 0">${w.name}</h1><p class="subtle">${w.desc}. Cada missió té 8 proves i pots tornar a practicar tantes vegades com vulgues.</p><div class="box"><b>Com vols practicar?</b><div class="choiceType" style="margin-top:13px"><button class="${state.mode==='mixed'?'active':''}" onclick="setMode('mixed')">🎲 Barrejat</button><button class="${state.mode==='write'?'active':''}" onclick="setMode('write')">✍️ Escriure</button></div><p class="subtle">En mode escriptura pots teclejar o escriure a mà sobre la pantalla.</p><button class="btn wide" onclick="startMission()">Començar missió →</button></div><div class="box">⭐ Missions superades: <b>${state.done[w.id]||0}</b><br>💡 Cada error torna a aparéixer en els repassos.</div>`}
function go(s){state.screen=s;render()}function openWorld(id){state.world=id;state.mode='mixed';go('world')}function setMode(x){state.mode=x;render()}
function makeQuestions(id,n,forceWrite=false){let bank=id==='exam'?W.flatMap(w=>B[w.id].map(q=>({w:w.id,q}))):B[id].map(q=>({w:id,q}));let errors=bank.filter(o=>(state.mistakes[o.w+'|'+o.q[0]]||0)>0);let selected=[...shuffle(errors).slice(0,Math.min(3,n)),...shuffle(bank)].filter((o,i,a)=>a.findIndex(x=>x.w===o.w&&x.q[0]===o.q[0])===i).slice(0,n);if(selected.length<n){let more=shuffle(bank).filter(o=>!selected.some(s=>s.q[0]===o.q[0]));selected.push(...more.slice(0,n-selected.length))}return selected.map((o,i)=>({world:o.w,prompt:o.q[0],answer:o.q[1],options:o.q[2],type:forceWrite||o.q[4]==='write'||(i%3===2)?'write':'choice'}))}
function startMission(){state.session={questions:makeQuestions(state.world,8,state.mode==='write'),i:0,score:0,missed:0,exam:false};nextQ();go('quiz')}
function startExam(){state.session={questions:makeQuestions('exam',20),i:0,score:0,missed:0,exam:true};nextQ();go('quiz')}
function nextQ(){state.choice=null;state.typed='';state.revealed=false;state.answered=false;state.correct=false;state.hand=false;state.strokes=[]}
function norm(x){return String(x).toLocaleLowerCase('ca').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim()}
function question(){const S=state.session,q=S.questions[S.i],isChoice=q.type==='choice';return `<div class="qtop"><button class="back" onclick="go('${S.exam?'home':'world'}')">← Eixir</button><span class="pill">${S.exam?'SIMULACRE':'MISSIÓ'} ${S.i+1} / ${S.questions.length}</span></div><div class="progress"><div style="width:${100*S.i/S.questions.length}%"></div></div><div class="tag">${tag(q.world)} · ${isChoice?'Tria la resposta':'Escriu el conjur'}</div><div class="question">${escapeHTML(q.prompt)}</div>${isChoice?`<div class="answers">${q.options.map((o,i)=>`<button class="option ${state.choice===i?'selected':''}" ${state.answered?'disabled':''} onclick="choose(${i})">${escapeHTML(o)}</button>`).join('')}</div>`:`<div class="choiceType"><button class="${!state.hand?'active':''}" onclick="handMode(false)" ${state.answered?'disabled':''}>⌨️ Amb teclat</button><button class="${state.hand?'active':''}" onclick="handMode(true)" ${state.answered?'disabled':''}>✍️ A mà</button></div>${state.hand?`<div class="canvasbox"><canvas id="pad" width="720" height="360" aria-label="Zona per escriure a mà"></canvas></div><div class="canvasactions"><button class="btn secondary" onclick="clearPad()" ${state.answered?'disabled':''}>↺ Esborrar</button></div><p class="notice">Escriu amb el dit o un llapis tàctil. Quan acabes, mostra la solució i comprova-la tu mateixa.</p>`:`<input id="answerInput" class="writing" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Escriu ací…" value="${escapeHTML(state.typed)}" oninput="state.typed=this.value" ${state.answered?'disabled':''}>`}`}${state.answered?`<div class="feedback ${state.correct?'':'err'}"><b>${state.correct?'🌟 Molt bé!':state.hand?'🔎 Compara la teua resposta':'💡 Aprenem de l’error'}</b><div>Resposta correcta: <strong>${escapeHTML(q.answer)}</strong></div>${!state.correct?'Torna a fixar-te en com s’escriu.':'Has recuperat una paraula!'}</div>`:''}<div style="height:18px"></div>${state.answered?state.hand&&!state.revealed?`<div class="choiceType"><button onclick="selfCheck(true)">✅ Ho he escrit bé</button><button onclick="selfCheck(false)">🔁 He de practicar</button></div>`:`<button class="btn gold wide" onclick="advance()">${S.i===S.questions.length-1?'Veure el premi 🎁':'Següent prova →'}</button>`:`<button class="btn wide" onclick="check()">${state.hand?'Mostrar la solució':'Comprovar ✓'}</button>`}`}
function choose(i){if(state.answered)return;state.choice=i;render()}
function handMode(h){if(state.answered)return;state.hand=h;render()}
function check(){const q=state.session.questions[state.session.i];if(q.type==='choice'){if(state.choice===null){alert('Tria una resposta.');return}let chosen=q.options[state.choice];complete(norm(chosen)===norm(q.answer))}else if(state.hand){state.revealed=false;state.answered=true;render();}else{if(!state.typed.trim()){alert('Escriu una resposta.');return}complete(norm(state.typed)===norm(q.answer))}}
function selfCheck(correct){state.revealed=true;state.correct=correct;saveAnswer(correct);render()}
function complete(correct){state.answered=true;state.correct=correct;saveAnswer(correct);render()}
function saveAnswer(correct){let S=state.session,q=S.questions[S.i],key=q.world+'|'+q.prompt;if(correct){S.score++;state.stars+=2;if(state.mistakes[key])state.mistakes[key]--}else{S.missed++;state.mistakes[key]=(state.mistakes[key]||0)+1}store()}
function advance(){let S=state.session;if(state.hand&&state.answered&&!state.revealed)return;S.i++;if(S.i>=S.questions.length){if(!S.exam&&S.score>=5)state.done[state.world]=(state.done[state.world]||0)+1;let totalCoffers=Math.floor(state.stars/30);if(totalCoffers>state.coffers)state.coffers=totalCoffers;store();go('result')}else{nextQ();render()}}
function result(){let S=state.session;let good=S.score>=Math.ceil(S.questions.length*.7);return `<div class="trophy"><div class="big">${good?'🏆':'💚'}</div><h2>${good?'Missió superada!':'Bona faena! Continuem!'}</h2><p>${good?'El Grinx ha perdut una altra batalla!':'Has practicat. Ara reforçarem les paraules difícils.'}</p><div class="stars">${'⭐'.repeat(Math.min(5,Math.round(S.score/S.questions.length*5)))}</div><h1>${S.score} / ${S.questions.length}</h1><p>Has guanyat <b>${S.score*2} estrelles</b>!</p>${state.stars>=30?'<div class="confetti">🎊🎁🎉</div>':''}</div><div class="box">${S.missed?`<b>🔁 ${S.missed} paraules per repassar</b><p class="subtle">Les preguntes fallades tindran preferència en futures missions.</p>`:'<b>✨ Cap error! Fantàstic!</b>'}</div><button class="btn wide" onclick="${S.exam?'startExam()':'startMission()'}">Tornar a practicar</button><div style="height:10px"></div><button class="btn secondary wide" onclick="go('home')">Tornar al mapa</button>`}
function prizes(){let names=['Primer conjur','Caçadora de paraules','Valenta del valencià','Mestra dels mesos','Heroïna de la lectura','Guardiana del Grinx'];let unlocked=names.map((_,i)=>state.stars>=(i+1)*20);return `<h1>🎁 Cofres i recompenses</h1><p class="subtle">Les estrelles es guanyen per aprendre i revisar. No cal córrer!</p><div class="trophy"><div class="big">🏅</div><h2>${state.stars} estrelles</h2><p>${state.coffers} cofres aconseguits</p><div class="progress"><div style="width:${(state.stars%30)/30*100}%"></div></div><small>Falten ${30-state.stars%30} estrelles per al pròxim cofre</small></div><h2 class="section">Insígnies màgiques</h2><div class="medals">${names.map((x,i)=>`<div class="medal" style="opacity:${unlocked[i]?1:.42}"><span>${unlocked[i]?['🌟','🔮','🦸','📅','📖','👑'][i]:'🔒'}</span><strong>${x}</strong><div class="tiny" style="color:#607d6c">${(i+1)*20} ⭐</div></div>`).join('')}</div><div class="reward"><div class="emoji">🧩</div><div><b>Premi sorpresa</b><div class="subtle">Cada cofre desbloqueja una nova frase divertida del Grinx.</div><div style="margin-top:8px">${['«No m’agafaràs mai!»','«Ai, quines paraules més difícils!»','«Eres massa llesta per a mi!»','«Torne a amagar les paraules!»','«Açò no estava en els meus plans!»'].slice(0,state.coffers).map(x=>`<div>💬 ${x}</div>`).join('')}</div></div></div>`}
function stats(){return `<h1>📊 El meu progrés</h1><p class="subtle">Així veuràs els temes que ja controles i els que necessiten un altre repàs.</p>${W.map(w=>`<div class="box"><div class="row"><b>${w.icon} ${w.name}</b><span>${state.done[w.id]||0} missions</span></div><div class="meter" style="margin-top:12px"><div class="fill" style="width:${Math.min(100,(state.done[w.id]||0)*20)}%"></div></div></div>`).join('')}<h2 class="section">Paraules per reforçar</h2>${Object.entries(state.mistakes).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<div class="box"><b>${escapeHTML(k.split('|')[1])}</b><div class="subtle">${v} error${v>1?'s':''} pendent${v>1?'s':''}</div></div>`).join('')||'<div class="box">Encara no hi ha errors per repassar.</div>'}`}
function render(){const main=state.screen==='home'?home():state.screen==='world'?world():state.screen==='quiz'?question():state.screen==='result'?result():state.screen==='prizes'?prizes():stats();$('#root').innerHTML=`<header class="top"><div><div class="brand">🌲 EL GRINX</div><div class="tiny">i les paraules perdudes</div></div><div class="wallet">⭐ ${state.stars}</div></header><main class="screen">${main}</main><nav class="bottom"><button class="nav ${state.screen==='home'?'active':''}" onclick="go('home')"><span class="nicon">🗺️</span>Mapa</button><button class="nav ${state.screen==='prizes'?'active':''}" onclick="go('prizes')"><span class="nicon">🎁</span>Premis</button><button class="nav ${state.screen==='stats'?'active':''}" onclick="go('stats')"><span class="nicon">📈</span>Progrés</button><button class="nav" onclick="startExam()"><span class="nicon">🏆</span>Examen</button></nav>`;if(state.screen==='quiz'&&state.hand&&!state.answered)initPad()}
function initPad(){const canvas=$('#pad');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.strokeStyle='#203a47';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);let [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke()};canvas.onpointermove=e=>{if(!drawing)return;let [x,y]=point(e);ctx.lineTo(x,y);ctx.stroke()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false}
function clearPad(){let c=$('#pad');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}render();
</script></body></html>
