const defaultState={owner:'Emilio',device:'ios',place:'Requena',region:'Valencia',lat:39.4883,lon:-1.1007,timezone:'Europe/Madrid',spaces:['exterior','invernadero'],irrigation:'goteo',soil:'desconocido',configured:false,plantings:[],trees:[],supplies:[],tasksDone:{},alertsSeen:{},notifications:false,wellTimer:null,wellHistory:[],wellConfig:{flow:0},irrigationSectors:[]};let state;try{state={...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaultState}};let tab='inicio',weather=null,weatherError='',locResults=[],photoData=null,filter='todos';let lastWeatherLoad=0;

const moon=(date)=>{const ms=date.getTime(),known=Date.UTC(2000,0,6,18,14),syn=29.530588853,age=((ms-known)/86400000%syn+syn)%syn,phase=age/syn;let label=age<1.8||age>27.8?'Luna nueva':age<5.5?'Creciente inicial':age<9.2?'Cuarto creciente':age<13.3?'Gibosa creciente':age<16.2?'Luna llena':age<20?'Gibosa menguante':age<24?'Cuarto menguante':'Menguante final';return {age,phase,label,icon:age<1.8||age>27.8?'🌑':age<9.2?'🌒':age<13.3?'🌔':age<16.2?'🌕':age<24?'🌖':'🌘',trad:age<7.4?'hoja':age<14.8?'fruto':age<22.1?'raíz':'raíz'};};

function forecastAt(offset){if(!weather||!weather.daily)return null;const target=iso(addDays(TODAY(),offset)),idx=weather.daily.time.indexOf(target);if(idx<0)return null;let day=weather.daily;return {date:target,min:day.temperature_2m_min[idx],max:day.temperature_2m_max[idx],rain:day.precipitation_sum[idx],wind:day.wind_speed_10m_max[idx],prob:day.precipitation_probability_max?.[idx]??null};}
function danger(w){return w&&(w.min<=0||w.wind>=35||w.rain>=12)};
function weatherSummary(w){if(!w)return 'Sin previsión actualizada';return `${Math.round(w.min)}° / ${Math.round(w.max)}° · ${Math.round(w.rain)} mm lluvia · viento ${Math.round(w.wind)} km/h`}
function fruitAdvice(tree,d=TODAY(),w=forecastAt(0)){const m=d.getMonth()+1,sp=tree.name, cold=['Manzano','Peral','Ciruelo','Melocotonero','Cerezo','Albaricoquero','Almendro'].includes(sp),stone=['Ciruelo','Melocotonero','Cerezo','Albaricoquero','Almendro'].includes(sp);let period=sp==='Olivo'?[2,3,4].includes(m):sp==='Cítrico'?[3,4,5].includes(m):sp==='Higuera'?[1,2].includes(m):sp==='Granado'?[1,2,3].includes(m):stone?[7,8,9].includes(m):cold?[1,2,3].includes(m):false;let msg=period?'Ventana orientativa para revisar la poda, según especie y estado.':'No es una ventana general de poda recomendada para esta especie.';if(stone&&[12,1,2].includes(m))msg='En frutales de hueso suele ser prudente limitar cortes invernales en climas fríos; considerar poda tras cosecha según especie.';if(w?.min<=2)msg+=' Evitar cortes con heladas previstas.';if(w?.rain>=8)msg+=' Aplazar si se esperan lluvias importantes.';return {period:period&&!danger(w),text:msg}};

async function loadWeather(){weatherError='';try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(state.lat)}&longitude=${encodeURIComponent(state.lon)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=${encodeURIComponent(state.timezone||'auto')}&forecast_days=16`;const res=await fetch(url,{signal:AbortSignal.timeout(11000)});if(!res.ok)throw Error('Servicio no disponible');weather=await res.json();lastWeatherLoad=Date.now();}catch(e){weather=null;lastWeatherLoad=Date.now();weatherError='No se pudo conectar con la previsión. Comprueba la conexión y vuelve a intentarlo.'}render();}
async function findPlace(q){const box=document.getElementById('locationResults');if(!box)return;if(q.trim().length<2){box.innerHTML='Escribe al menos dos letras.';return};box.textContent='Buscando...';try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=es&format=json`,{signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error('Error');const j=await r.json();locResults=(j.results||[]).filter(x=>x.country_code==='ES');box.innerHTML=locResults.length?locResults.map((x,i)=>`<button class="button outline small" style="width:100%;text-align:left;margin:4px 0" data-loc="${i}">${safe(x.name)} · ${safe(x.admin1||'')} · ${safe(x.country)}</button>`).join(''):'Sin resultados en España. Comprueba el nombre.';}catch{box.textContent='No se pudo buscar la localidad. Inténtalo de nuevo.'}}
function recommendations(){const w=forecastAt(0),moonNow=moon(TODAY()),week=[];for(let i=1;i<=10;i++){const f=forecastAt(i);if(f&&!danger(f)&&f.max>=7&&f.min>=1){week.push({offset:i,w:f});}}const suitable=C.filter(c=>plantable(c)&&state.spaces.some(s=>c.types.includes(s)));const priorities=[];if(w&&w.min<=2)priorities.push({icon:'❄',title:'Protege frente al frío',body:`Mínima prevista ${Math.round(w.min)} °C. Comprueba protecciones y no trasplantes plantas sensibles.`});else if(w&&w.rain>=8)priorities.push({icon:'☂',title:'Atención a las lluvias',body:'Evita trabajar el suelo mojado; revisa drenaje y aplaza riegos si no son necesarios.'});else priorities.push({icon:'🌱',title:'Revisa el bancal antes de plantar',body:'Comprueba humedad, estructura del suelo y condiciones del cultivo antes de actuar.'});priorities.push({icon:'🍂',title:'Cuida el suelo vivo',body:'Mantén acolchado orgánico donde proceda, sin tapar el cuello de las plantas.'});if(state.trees.length){const t=state.trees[0],a=fruitAdvice(t);priorities.push({icon:'✂',title:`Revisa tu ${t.name.toLowerCase()}`,body:a.text})}else priorities.push({icon:'☾',title:`Calendario tradicional: ${moonNow.trad}`,body:'Referencia cultural opcional; no sustituye a las condiciones agronómicas.'});const shopping=[];for(const c of suitable.filter(c=>c.seed.includes('Plantel')).slice(0,3)){const e=week.find(x=>x.offset>=3&&x.offset<=8);if(e)shopping.push({crop:c,offset:e.offset,date:addDays(TODAY(),e.offset),reason:'Ventana meteorológica prevista razonable; verificar otra vez 24–48 h antes.'});}return {suitable,priorities,shopping,week}}

let wellTickInterval=null,wellAudio=null,lastWellBeep=0;
function wellRemaining(){return state.wellTimer?Math.max(0,Math.ceil((state.wellTimer.ends-Date.now())/1000)):0}
function wellTimeString(v){return String(Math.floor(v/3600)).padStart(2,"0")+":"+String(Math.floor((v%3600)/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0")}
function wellBeep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;wellAudio=wellAudio||new A();wellAudio.resume().catch(()=>{});for(let i=0;i<3;i++){const at=wellAudio.currentTime+i*.35,o=wellAudio.createOscillator(),g=wellAudio.createGain();o.type="sine";o.frequency.value=880;o.connect(g);g.connect(wellAudio.destination);g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(.18,at+.03);g.gain.exponentialRampToValueAtTime(.001,at+.23);o.start(at);o.stop(at+.25)}}catch(e){}}
function wellCheck(){const t=state.wellTimer;if(!t)return;const expired=Date.now()>=t.ends;const counter=document.getElementById("wellCountdown");if(counter)counter.textContent=expired?"¡TIEMPO CUMPLIDO!":wellTimeString(wellRemaining());const banner=document.getElementById("wellAlert");if(banner)banner.hidden=!expired;if(expired&&Date.now()-lastWellBeep>=12000){lastWellBeep=Date.now();wellBeep();try{navigator.vibrate&&navigator.vibrate([300,140,300])}catch(e){}}}

function irrigationSections(){return Array.isArray(state.irrigationSectors)?state.irrigationSectors:[]}
function irrigationLinkedName(v){const rec=[...(state.plantings||[]),...(state.trees||[])].find(x=>x.id===v.linkId);return rec?rec.name:"Sector general"}
function irrigationLast(v){return (Array.isArray(state.wellHistory)?state.wellHistory:[]).find(x=>x.sectorId===v.id&&x.stop)?.stop||null}
function irrigationFlow(v){const f=Number(v.flow);return f>0?f:(Number(v.emitters)>0&&Number(v.emitterFlow)>0?Number(v.emitters)*Number(v.emitterFlow):0)}
function irrigationMinutes(v){const f=irrigationFlow(v),liters=Number(v.liters);return f>0&&liters>0?Math.round(liters/f*60):null}
function irrigationAdvice(v){const w=forecastAt(0),next=forecastAt(1),last=irrigationLast(v),days=last?(Date.now()-last)/86400000:null;if(!w)return {tag:"Sin previsión",msg:"No se puede valorar el clima. Comprueba la humedad del suelo antes de decidir."};if(w.rain>=5||next?.rain>=8)return {tag:"Comprobar lluvia",msg:"Hay lluvia prevista. Comprueba la humedad antes de regar; podría no hacer falta."};if(w.min<=0)return {tag:"Helada prevista",msg:"Revisa riesgo de hielo y la humedad. Evita programar riegos sin valorar las condiciones."};if(days!==null&&days<1)return {tag:"Riego reciente",msg:"Este sector se regó hace menos de 24 horas. No repitas sin comprobar el suelo."};if(w.max>=27&&w.rain<2)return {tag:"Revisar si regar hoy",msg:"Hace calor y se prevé poca lluvia. Comprueba humedad, suelo y necesidades del cultivo."};if(days!==null&&days>4&&w.rain<2)return {tag:"Posible necesidad de riego",msg:"Varios días sin riego registrado y poca lluvia. Comprueba la humedad antes de abrir el pozo."};return {tag:"Comprobar humedad",msg:"La previsión no justifica por sí sola un riego. Revisa el terreno y el estado de las plantas."}}
function irrigationList(){const sectors=irrigationSections();return '<div class="sectionhead"><h2>Riego de tu huerta</h2><button class="button ghost small" data-action="settings">Configurar sectores</button></div>'+(sectors.length?sectors.map(v=>{const a=irrigationAdvice(v),m=irrigationMinutes(v);return '<div class="card" style="margin-bottom:10px"><div class="eyebrow">'+safe(v.name)+'</div><h3>'+safe(irrigationLinkedName(v))+'</h3><p><strong>'+safe(a.tag)+'</strong> · '+safe(a.msg)+'</p><p class="tiny subtle">'+(m!==null?'Tiempo calculado con los datos de riego: '+m+' min':'Falta caudal del sector o litros objetivo para calcular duración')+'</p><p class="tiny subtle">'+(irrigationLast(v)?'Último riego: '+safe(fmt(new Date(irrigationLast(v)))):'Todavía sin riego registrado')+'</p><button class="button outline small" data-action="select-sector" data-value="'+safe(v.id)+'">Regar este sector</button></div>'}).join(''):'<div class="notice">Configura tus sectores en Ajustes y vincúlalos con los cultivos o árboles que tengas registrados.</div>')}
function irrigationSetup(){const sectors=irrigationSections(),items=[...(state.plantings||[]),...(state.trees||[])];return '<div class="card stack" style="margin-top:14px"><h3>Configurar el pozo</h3><p class="compact subtle">Registra el caudal general y los sectores independientes de árboles, invernadero o bancales. Para calcular minutos hacen falta los litros objetivo y el caudal que realmente sale por cada sector.</p><form id="wellConfigForm" class="stack"><label class="label">Caudal aproximado del pozo (litros/hora)</label><input class="field" type="number" name="flow" min="0" step="any" placeholder="Si lo sabes" value="'+safe(state.wellConfig?.flow||"")+'"><button class="button outline" type="submit">Guardar datos del pozo</button></form><div class="divider"></div><h3>Mis sectores</h3>'+(sectors.length?sectors.map(v=>'<div class="action"><div style="flex:1"><strong>'+safe(v.name)+'</strong><p class="tiny subtle">'+safe(irrigationLinkedName(v))+' · '+(irrigationFlow(v)?irrigationFlow(v)+' L/h':'caudal pendiente')+'</p></div><button class="button ghost small" data-sector-remove="'+safe(v.id)+'">Eliminar</button></div>').join(''):'<p class="tiny subtle">Añade cada zona que Emilio pueda abrir o cerrar por separado.</p>')+'<form id="sectorForm" class="stack"><div><label class="label">Nombre del sector</label><input class="field" name="name" placeholder="Ej.: manzanos, lechugas, bancal 2" required></div><div><label class="label">Relacionar con un árbol o cultivo</label><select class="field" name="linkId"><option value="">Varios cultivos / sector general</option>'+items.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.name)+'</option>').join('')+'</select></div><div><label class="label">Sistema</label><select class="field" name="method"><option>goteo</option><option>aspersión</option><option>manguera</option><option>alcorque</option></select></div><div class="two"><div><label class="label">Caudal del sector, L/h</label><input class="field" type="number" name="flow" min="0" step="any" placeholder="Si lo conoces"></div><div><label class="label">Litros objetivo por riego</label><input class="field" type="number" name="liters" min="0" step="any" placeholder="Si lo conoces"></div></div><div class="two"><div><label class="label">N.º de goteros (opcional)</label><input class="field" type="number" name="emitters" min="0"></div><div><label class="label">Caudal por gotero (L/h)</label><input class="field" type="number" name="emitterFlow" min="0" step="any"></div></div><button class="button" type="submit">Añadir sector</button></form><p class="well-note">El caudal total del pozo no equivale al caudal de un sector. Si falta un dato, el temporizador permitirá introducir el tiempo manualmente.</p></div>'}

function wellTimerView(){const t=state.wellTimer,ss=irrigationSections();let h='<section class="well-timer"><div class="eyebrow">Temporizador del pozo</div><h2>Riego por sector</h2>';if(!t){h+='<p class="compact">Selecciona un sector y confirma que has encendido la bomba.</p><div class="well-fields"><div><label class="label">Sector de riego</label><select class="field" id="wellZone">'+(ss.length?ss.map(v=>'<option value="'+safe(v.id)+'">'+safe(v.name)+'</option>').join(''):'<option value="">Configura primero los sectores</option>')+'</select></div><div><label class="label">Minutos</label><input class="field" id="wellMinutes" type="number" min="1" max="720" inputmode="numeric" placeholder="Manual"></div></div><p id="wellRecommendation" class="well-note"></p><button class="button" data-action="well-start" '+(ss.length?'':'disabled')+'>He encendido el pozo · Iniciar</button>';}else{const expired=wellRemaining()===0;h+='<p><strong>💧 '+safe(t.zone)+'</strong></p><div class="well-count" id="wellCountdown">'+(expired?'¡TIEMPO CUMPLIDO!':wellTimeString(wellRemaining()))+'</div><div class="well-alert" id="wellAlert" '+(expired?'':'hidden')+'><strong>¡'+safe(t.zone)+' regando! ¡PARAR EL POZO!</strong><p>Apaga físicamente la bomba y confírmalo.</p></div><button class="button" data-action="well-stop">✓ Ya he apagado el pozo</button>';}return h+'<p class="well-note">El sonido requiere la app activa. No se garantiza aviso con iPhone bloqueado ni se apaga la bomba automáticamente.</p></section>'}
function updateWellProposal(){const select=document.getElementById("wellZone"),v=irrigationSections().find(x=>x.id===select?.value),field=document.getElementById("wellMinutes"),el=document.getElementById("wellRecommendation");if(!v||!field||!el)return;const m=irrigationMinutes(v),a=irrigationAdvice(v);field.value=m!==null&&m>=1&&m<=720?String(m):"";el.textContent=a.tag+": "+a.msg+(m===null?" Falta caudal o volumen objetivo; introduce minutos manualmente.":" Duración orientativa: "+m+" minutos.")}
function wellStart(){const mins=Number(document.getElementById("wellMinutes")?.value),sectorId=document.getElementById("wellZone")?.value,sector=irrigationSections().find(x=>x.id===sectorId),zone=sector?.name;if(!sector){toast("Configura primero un sector");return;}if(!Number.isFinite(mins)||mins<1||mins>720){toast("Indica entre 1 y 720 minutos");return}try{const A=window.AudioContext||window.webkitAudioContext;if(A){wellAudio=wellAudio||new A();wellAudio.resume().catch(()=>{})}}catch(e){}state.wellTimer={zone:zone||"Pozo",sectorId,start:Date.now(),ends:Date.now()+Math.round(mins*60000)};save();render()}

<article class="card"><div class="eyebrow">Luna · cálculo astronómico aproximado</div><div class="mini-weather"><div><h3>${m.label}</h3><p class="tiny subtle">Calendario lunar · ${m.trad}</p></div><span style="font-size:36px">${m.icon}</span></div></article></div>
<div class="sectionhead"><h2>Lo importante hoy</h2><span class="pill">${r.priorities.length} sugerencias</span></div><div class="card">${r.priorities.map(a=>`<div class="action"><div class="dot">${a.icon}</div><div><strong>${a.title}</strong><p class="subtle compact">${a.body}</p></div></div>`).join('')}</div>
<div class="sectionhead"><h2>Anticípate</h2><button class="button ghost small" data-tab="plan">Ver plan →</button></div><div class="card"><div class="eyebrow">Compra y prepara con días de margen</div>${r.shopping.length?r.shopping.map(x=>`<div class="action"><div class="dot">🧺</div><div><strong>${x.crop.name}: prepara plantel</strong><p class="compact">Posible trasplante: <b>${fmt(x.date,{weekday:'long',day:'numeric',month:'long'})}</b> (${x.offset} días). ${x.reason}</p><button class="button outline small" data-action="supply" data-value="${x.crop.id}">${state.supplies.includes(x.crop.id)?'✓ Ya lo tengo':'Marcar: ya lo tengo'}</button></div></div>`).join(''):'<p class="subtle">No se ha detectado una ventana segura de compra y trasplante para los próximos días con los criterios iniciales. Revisa la previsión y los cultivos.</p>'}<div class="notice tiny" style="margin-top:12px">La previsión meteorológica permite planificar hasta 16 días; el horizonte de 2–4 semanas es estacional y orientativo.</div></div>
<div class="sectionhead"><h2>Qué plantar ahora</h2><button class="button ghost small" data-tab="cultivos">Ver todos →</button></div><div class="grid3">${r.suitable.slice(0,6).map(c=>miniCrop(c)).join('')||'<div class="card">No hay cultivos del catálogo que encajen con esta selección.</div>'}</div>`}
function miniCrop(c){return `<div class="card cropcard"><span class="cropIcon">${c.emoji}</span><strong>${c.name}</strong><span class="tiny subtle">${c.seed}</span><button class="button outline small" data-crop="${c.id}">Ver ficha →</button></div>`}
function cropsView(){const suitable=recommendations().suitable;let list=filter==='ahora'?suitable:filter==='raiz'?C.filter(x=>x.kind==='raíz'):filter==='hoja'?C.filter(x=>x.kind==='hoja'):filter==='fruto'?C.filter(x=>x.kind==='fruto'):filter==='flor'?C.filter(x=>x.kind==='flor'):C;return `${header('Qué plantar','Selecciona un cultivo y consulta fechas orientativas, técnicas y asociaciones.')}<div class="chips">${[['todos','Todos'],['ahora','Ahora en mi zona'],['raiz','Raíz'],['hoja','Hoja'],['fruto','Fruto'],['flor','Flor']].map(([k,v])=>`<button class="chip ${filter===k?'on':''}" data-filter="${k}">${v}</button>`).join('')}</div><p class="subtle tiny" style="margin-bottom:13px">Las ventanas del catálogo son generales para clima mediterráneo. Ajusta por altitud, variedad, heladas y microclima.</p><div class="grid3">${list.map(c=>`<article class="card cropcard"><span class="cropIcon">${c.emoji}</span><strong>${c.name}</strong><span class="pill ${plantable(c)?'':'neutral'}">${plantable(c)?'En temporada orientativa':'Fuera de temporada'}</span><span class="tiny subtle">${safe(c.seed)}</span><button class="button outline small" data-crop="${c.id}">Ficha del cultivo</button></article>`).join('')}</div>`}
function planView(){const r=recommendations(),m=moon(TODAY()),next=Array.from({length:7},(_,i)=>({i,w:forecastAt(i),d:addDays(TODAY(),i)}));const monthly=addDays(TODAY(),28);return `${header('Plan de trabajo','Hoy, esta semana y las próximas cuatro semanas.')}<div class="card"><div class="eyebrow">Próximos siete días · previsión real si está disponible</div>${next.map(x=>{const tasks=[];if(!x.w)tasks.push('Consultar previsión actualizada antes de trabajos delicados.');else if(x.w.min<=2)tasks.push('Revisar protección frente a heladas; aplazar trasplantes sensibles.');else if(x.w.rain>=8)tasks.push('Comprobar drenaje, evitar pisar el suelo húmedo y revisar riego.');else if(x.w.wind>=35)tasks.push('Evitar poda y pulverizaciones por viento.');else tasks.push('Revisar semilleros, humedad y bancales preparados.');if(x.i===0)tasks.push('Comprobar acolchado y observar el estado de los cultivos.');if(x.i===3)tasks.push('Revisar existencias de plantel, compost y material de protección.');if(x.i===5)tasks.push('Planificar rotación y asociaciones de la siguiente plantación.');return `<div class="dayrow"><div><strong>${safe(fmt(x.d,{weekday:'short'}))}</strong><p class="tiny subtle">${fmt(x.d)}</p></div><div><div class="tiny subtle">${x.w?weatherSummary(x.w):'Previsión no disponible'}</div>${tasks.map((t,j)=>{const k=iso(x.d)+'-'+j;return `<label class="checkrow"><input type="checkbox" data-done="${k}" ${state.tasksDone[k]?'checked':''}><span class="compact">${t}</span></label>`}).join('')}</div></div>`}).join('')}</div>
<div class="sectionhead"><h2>Compras próximas</h2></div><div class="card">${r.shopping.length?r.shopping.map(x=>`<div class="action"><div class="dot">🧺</div><div><strong>${x.crop.name}</strong><p class="compact">Compra unos 3–5 días antes de ${fmt(x.date)} si la previsión se mantiene favorable.</p><button class="button outline small" data-action="supply" data-value="${x.crop.id}">${state.supplies.includes(x.crop.id)?'✓ Comprado':'Marcar comprado'}</button></div></div>`).join(''):'<p class="subtle">Sin compras prioritarias identificadas con la previsión disponible.</p>'}</div><div class="sectionhead"><h2>Mirada a cuatro semanas</h2></div><div class="card"><p>Hasta <b>${fmt(monthly,{day:'numeric',month:'long'})}</b>, revisa variedades de temporada, disponibilidad de semillas, rotaciones, abonado y zonas a cubrir.</p><p class="subtle compact">No se asignan fechas meteorológicas exactas más allá del alcance fiable de la previsión. El calendario lunar tradicional se usa solo como referencia opcional.</p><div class="divider"></div><strong>Mis frutales</strong>${state.trees.length?state.trees.map(t=>`<p class="compact">✂ ${safe(t.name)}: ${fruitAdvice(t).text}</p>`).join(''):'<p class="subtle compact">Añade tus árboles en «Mi huerta» para recibir orientación específica sobre la poda.</p>'}</div>`}
function gardenView(){return `${header('Mi huerta','Tu registro personal de plantaciones y frutales.')}<div class="stats"><div class="stat">🌱 ${state.plantings.length} plantaciones</div><div class="stat">🌳 ${state.trees.length} frutales</div><div class="stat">🧺 ${state.supplies.length} compras marcadas</div></div><div class="sectionhead"><h2>Mis cultivos</h2><button class="button small" data-action="addplant">+ Añadir</button></div><div class="card">${state.plantings.length?state.plantings.map(p=>`<div class="action"><div class="dot">🌱</div><div style="flex:1"><strong>${safe(p.name)}</strong><p class="tiny subtle">${safe(p.area||'Huerta')} · Plantado ${safe(p.date)}</p></div><button class="button ghost small" data-remove="plant:${p.id}" aria-label="Eliminar">✕</button></div>`).join(''):'<div class="empty">Registra qué has plantado para empezar tu cuaderno de campo.</div>'}</div><div class="sectionhead"><h2>Mis frutales</h2><button class="button small" data-action="addtree">+ Añadir</button></div><div class="card">${state.trees.length?state.trees.map(t=>`<div class="action"><div class="dot">🌳</div><div style="flex:1"><strong>${safe(t.name)}</strong><p class="tiny subtle">${safe(t.age||'Edad no indicada')} · Última poda: ${safe(t.last||'sin registrar')}</p><p class="compact">${safe(fruitAdvice(t).text)}</p></div><button class="button ghost small" data-remove="tree:${t.id}" aria-label="Eliminar">✕</button></div>`).join(''):'<div class="empty">Añade almendros, olivos, manzanos y otros árboles para planificar la poda.</div>'}</div><div class="sectionhead"><h2>Mis preferencias</h2></div><div class="card"><p><b>Localidad:</b> ${safe(state.place)}, ${safe(state.region)}</p><p><b>Espacios:</b> ${state.spaces.map(safe).join(', ')}</p><p><b>Riego:</b> ${safe(state.irrigation)}</p><p><b>Suelo:</b> ${safe(state.soil)}</p><button class="button outline small" style="margin-top:12px" data-action="settings">Editar configuración</button></div>`}
function photoView(){return `${header('Observa tus plantas','Prepara una consulta fotográfica sobre el estado de tus cultivos o la poda.')}<div class="card stack"><div class="notice"><strong>Versión inicial:</strong> permite adjuntar y visualizar imágenes, pero el diagnóstico visual con IA todavía no está conectado. No se analizarán ni enviarán fotografías a ningún servicio.</div><label class="label">Fotografía de la planta o árbol</label><input type="file" id="photoInput" class="field" accept="image/*" capture="environment"><div id="photoPreview">${photoData?`<img class="photo" src="${photoData}" alt="Fotografía seleccionada">`:'<div class="empty">📷 Tu foto aparecerá aquí.</div>'}</div><label class="label" for="photoQuestion">¿Qué quieres consultar?</label><textarea id="photoQuestion" class="field" placeholder="Ejemplo: las hojas del limonero amarillean, ¿qué debería observar?"></textarea><button class="button" data-action="photoExplain">Preparar consulta</button><p class="tiny subtle">Para activar el análisis real necesitaremos un servidor que conecte con un modelo de visión y proteja la clave de acceso. Ningún diagnóstico se considerará concluyente sin verificación.</p></div>`}
function settingsView(){const spaces=[['exterior','Huerta al aire libre'],['invernadero','Invernadero'],['bancal','Bancales elevados'],['bancal','Bancales elevados']];return `${header('Configura la huerta de Emiliete','Organiza los cultivos, los árboles y el riego de tu huerta.')}<form id="settingsForm" class="card stack"><input type="hidden" name="device" value="ios"><div><label class="label">Localidad española</label><div class="flex"><input id="locationSearch" class="field" value="${safe(state.place)}" placeholder="Busca tu municipio"><button class="button small" type="button" data-action="searchloc">Buscar</button></div><div id="locationResults" class="tiny subtle" style="margin-top:8px">Localidad seleccionada: ${safe(state.place)}, ${safe(state.region)}.</div></div><div><label class="label">Espacios de cultivo</label>${spaces.map(([val,name])=>`<label class="checkrow"><input type="checkbox" name="spaces" value="${val}" ${state.spaces.includes(val)?'checked':''}>${name}</label>`).join('')}</div><div class="two"><div><label class="label">Riego</label><select name="irrigation" class="field">${['goteo','aspersión','manual','sin instalación'].map(x=>`<option ${state.irrigation===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Suelo</label><select name="soil" class="field">${['desconocido','arcilloso','arenoso','franco'].map(x=>`<option ${state.soil===x?'selected':''}>${x}</option>`).join('')}</select></div></div><button class="button" type="submit">Guardar mi huerta</button></form>${irrigationSetup()}<div class="card" style="margin-top:14px"><h3>Avisos</h3><p class="compact subtle">En esta versión se muestran recordatorios al abrir la aplicación. Los avisos push con la aplicación cerrada requieren servidor y despliegue HTTPS.</p><button class="button outline small" data-action="permission" style="margin-top:11px">${state.notifications?'Permiso solicitado':'Solicitar permiso de notificaciones'}</button></div><div class="card" style="margin-top:14px"><h3>Mis datos</h3><p class="compact subtle">Las plantaciones, frutales y preferencias se guardan en este navegador; no se sincronizan entre teléfonos.</p><button class="button outline small" data-action="export">Exportar datos JSON</button></div>`}
function showModal(inner){document.getElementById('modalroot').innerHTML=`<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true"><div class="spread" style="margin-bottom:13px"><span class="eyebrow">Raíz Lunar</span><button class="button ghost small" data-action="close">Cerrar ✕</button></div>${inner}</div></div>`;}
function cropModal(c){showModal(`<div class="previewIcon">${c.emoji}</div><h2>${c.name}</h2><p class="subtle">${c.kind} · ${plantable(c)?'En temporada orientativa':'Fuera de temporada orientativa'}</p><div class="divider"></div><div class="stack compact"><p><b>Época general:</b> ${c.months.map(monthName).join(', ')}</p><p><b>Siembra o trasplante:</b> ${safe(c.seed)}</p><p><b>Profundidad:</b> ${safe(c.depth)}</p><p><b>Marco:</b> ${safe(c.space)}</p><p><b>Riego:</b> ${safe(c.water)}</p><p><b>Asociaciones orientativas:</b> ${safe(c.comp)}</p><p><b>Suelo vivo:</b> ${safe(c.tip)}</p><p><b>Precaución local:</b> comprobar heladas, variedad y estado del suelo antes de plantar.</p></div><button class="button" style="margin-top:17px;width:100%" data-action="addplant" data-value="${c.id}">+ Registrar plantación</button>`)}
function addPlantModal(c=''){showModal(`<h2>Nueva plantación</h2><form id="plantForm" class="stack" style="margin-top:15px"><div><label class="label">Cultivo</label><select class="field" name="crop">${C.map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${x.name}</option>`).join('')}</select></div><div><label class="label">Bancal o ubicación</label><input class="field" name="area" placeholder="Ejemplo: bancal 1 / invernadero"></div><div><label class="label">Fecha de plantación</label><input type="date" name="date" class="field" value="${iso(TODAY())}"></div><button class="button" type="submit">Guardar plantación</button></form>`)}
function addTreeModal(){showModal(`<h2>Nuevo árbol frutal</h2><form id="treeForm" class="stack" style="margin-top:15px"><div><label class="label">Especie</label><select name="name" class="field">${FRUIT.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label class="label">Edad aproximada</label><input name="age" class="field" placeholder="Ej.: 5 años / adulto"></div><div><label class="label">Última poda (opcional)</label><input name="last" class="field" type="date"></div><button class="button" type="submit">Guardar árbol</button></form>`)}
function toast(s){const el=document.getElementById('toastroot');el.innerHTML=`<div class="toast" role="status">${safe(s)}</div>`;setTimeout(()=>{el.innerHTML=''},4000)}
function render(){nav();let views={inicio:todayView,cultivos:cropsView,plan:planView,foto:photoView,huerta:gardenView,settings:settingsView};document.getElementById('app').innerHTML=(views[tab]||todayView)();if(tab==='inicio')updateWellProposal();}
function navigate(s){tab=s;render();window.scrollTo({top:0,behavior:'instant'})}
function supply(c){state.supplies=state.supplies.includes(c)?state.supplies.filter(x=>x!==c):[...state.supplies,c];save();render();}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`raiz-lunar-${iso(TODAY())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function interaction(e){let el=e.target.closest('[data-tab],[data-action],[data-crop],[data-filter],[data-remove],[data-loc]');if(!el)return;if(el.dataset.tab){navigate(el.dataset.tab);return}if(el.dataset.crop){cropModal(C.find(x=>x.id===el.dataset.crop));return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.loc!==undefined){const x=locResults[Number(el.dataset.loc)];if(x){state.place=x.name;state.region=x.admin1||'';state.lat=x.latitude;state.lon=x.longitude;state.timezone=x.timezone||'Europe/Madrid';save();document.getElementById('locationResults').innerHTML=`✓ Seleccionado: ${safe(x.name)}, ${safe(x.admin1||'')}`;document.getElementById('locationSearch').value=x.name;toast('Localidad seleccionada. Guarda la configuración.')}return}
if(el.dataset.remove){let [type,key]=el.dataset.remove.split(':');if(!confirm('¿Eliminar este registro?'))return;if(type==='plant')state.plantings=state.plantings.filter(x=>x.id!==key);else state.trees=state.trees.filter(x=>x.id!==key);save();render();return}
switch(el.dataset.action){case 'select-sector':navigate('inicio');{const input=document.getElementById('wellZone');if(input){input.value=el.dataset.value;updateWellProposal();input.scrollIntoView({behavior:'smooth',block:'center'})}}break;case 'well-start':wellStart();break;case 'well-stop':wellStop();break;case 'refresh':loadWeather();toast('Consultando previsión...');break;case 'settings':navigate('settings');break;case 'searchloc':findPlace(document.getElementById('locationSearch').value);break;case 'supply':supply(el.dataset.value);break;case 'addplant':addPlantModal(el.dataset.value);break;case 'addtree':addTreeModal();break;case 'close':document.getElementById('modalroot').innerHTML='';break;case 'photoExplain':toast('Fotografía preparada. El análisis real con IA todavía no está conectado.');break;case 'export':exportData();break;case 'permission':if(!('Notification'in window)){toast('Este navegador no dispone de notificaciones web.');break}Notification.requestPermission().then(v=>{state.notifications=v==='granted';save();toast(v==='granted'?'Permiso concedido. Falta configurar el servidor para envíos automáticos.':'Notificaciones no autorizadas.');render()});break;}}
document.addEventListener('click',interaction);document.addEventListener('change',e=>{if(e.target.id==='wellZone')updateWellProposal()});document.addEventListener('click',e=>{const el=e.target.closest('[data-sector-remove]');if(el&&confirm('¿Eliminar este sector de riego?')){state.irrigationSectors=irrigationSections().filter(x=>x.id!==el.dataset.sectorRemove);save();render()}});document.getElementById('settingsBtn').addEventListener('click',()=>navigate('settings'));document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){state.tasksDone[e.target.dataset.done]=e.target.checked;save()}if(e.target.id==='photoInput'){const f=e.target.files?.[0];if(!f)return;if(f.size>8_000_000){toast('Usa una foto de menos de 8 MB.');return}const rdr=new FileReader();rdr.onload=()=>{photoData=rdr.result;document.getElementById('photoPreview').innerHTML=`<img class="photo" alt="Fotografía seleccionada" src="${photoData}">`};rdr.readAsDataURL(f)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='settingsForm'){let f=new FormData(e.target),sp=f.getAll('spaces');state.device=f.get('device');state.spaces=sp.length?sp:['exterior'];state.irrigation=f.get('irrigation');state.soil=f.get('soil');state.configured=true;save();navigate('inicio');loadWeather();toast('Configuración guardada.');}if(e.target.id==='plantForm'){let f=new FormData(e.target),c=C.find(x=>x.id===f.get('crop'));state.plantings.push({id:id(),name:c.name,crop:c.id,area:String(f.get('area')),date:String(f.get('date'))});save();document.getElementById('modalroot').innerHTML='';navigate('huerta');toast('Plantación registrada.')}if(e.target.id==='wellConfigForm'){const f=new FormData(e.target);state.wellConfig={flow:Number(f.get('flow'))||0};save();render();toast('Pozo configurado.')}if(e.target.id==='sectorForm'){const f=new FormData(e.target);state.irrigationSectors=irrigationSections();state.irrigationSectors.push({id:id(),name:String(f.get('name')),linkId:String(f.get('linkId')||''),method:String(f.get('method')),flow:Number(f.get('flow'))||0,liters:Number(f.get('liters'))||0,emitters:Number(f.get('emitters'))||0,emitterFlow:Number(f.get('emitterFlow'))||0});save();render();toast('Sector añadido.')}if(e.target.id==='treeForm'){let f=new FormData(e.target);state.trees.push({id:id(),name:String(f.get('name')),age:String(f.get('age')),last:String(f.get('last'))});save();document.getElementById('modalroot').innerHTML='';navigate('huerta');toast('Frutal registrado.')}});
document.addEventListener('click',e=>{if(e.target.matches('[data-close]'))document.getElementById('modalroot').innerHTML=''});
render();loadWeather();wellTickInterval=setInterval(wellCheck,1000);wellCheck();document.addEventListener('visibilitychange',()=>{if(!document.hidden){wellCheck();if(Date.now()-lastWeatherLoad>30*60*1000)loadWeather()}});window.addEventListener('focus',()=>{if(Date.now()-lastWeatherLoad>30*60*1000)loadWeather()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
