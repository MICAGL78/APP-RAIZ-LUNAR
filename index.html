function daysSince(date){const d=new Date(date+'T12:00:00'),t=new Date(iso(TODAY())+'T12:00:00');return Math.floor((t-d)/86400000)}
function sensitive(c){return ['tomate','pimiento','berenjena','calabacin','pepino','judia','calabaza'].includes(c?.id)}
function mineToday(){const out=[],w=forecastAt(0),freeze=Array.from({length:6},(_,i)=>forecastAt(i)).find(x=>x&&x.min<=2);for(const p of state.plantings.slice(-12)){const c=C.find(x=>x.id===p.crop),days=daysSince(p.date),name=safe(p.name);if(days<0||!Number.isFinite(days))continue;if(freeze&&(sensitive(c)||days<=14)){out.push({icon:'❄',title:'Vigila '+name,body:'Plantado hace '+days+' días. Se prevén mínimas de '+Math.round(freeze.min)+' °C el '+safe(freeze.date)+'. Comprueba si necesita protección según especie y exposición.'})}if(w&&w.rain>=6)out.push({icon:'☂',title:'Revisa el riego de '+name,body:'Se prevén '+Math.round(w.rain)+' mm de lluvia. Comprueba la humedad del suelo antes de regar.'});else if(days<=10)out.push({icon:'💧',title:'Comprueba la humedad de '+name,body:'Plantación reciente ('+days+' días). Verifica el suelo junto a las raíces antes de decidir el riego.'});else if(w&&w.max>=27&&w.rain<2)out.push({icon:'💧',title:'Vigila el riego de '+name,body:'Se prevén '+Math.round(w.max)+' °C. Examina la humedad bajo el acolchado; evita regar sin comprobarla.'});}for(const t of state.trees.slice(0,5)){const a=fruitAdvice(t);if(a.period)out.push({icon:'✂',title:'Poda: '+safe(t.name),body:a.text})}return out.slice(0,6)}
function welcomeView(){return `<div class="welcome"><div class="welcome-symbol">❧</div><div class="card stack"><div class="eyebrow">Bienvenido a Raíz Lunar</div><h1>Tu huerta, a su ritmo.</h1><p class="subtle">Elige dónde cultivas y entra en tu cuaderno de campo. Recordaremos tus cultivos y frutales en este móvil.</p><div><label class="label">Localidad</label><div class="flex"><input id="locationSearch" class="field" value="${safe(state.place)}" placeholder="Requena"><button class="button outline small" data-action="searchloc">Buscar</button></div><div id="locationResults" class="tiny subtle" style="margin-top:9px">Seleccionada: ${safe(state.place)}, ${safe(state.region)}</div></div><button class="button" data-action="enterGarden">Entrar en mi huerta →</button><p class="tiny subtle">En las próximas visitas entrarás directamente. Puedes cambiar la localidad desde Ajustes.</p></div></div>`}
function nav(){const els=[['inicio','⌂','Hoy'],['cultivos','❧','Cultivos'],['plan','▦','Plan'],['foto','▣','IA'],['huerta','♧','Mi huerta']];document.getElementById('nav').innerHTML=els.map(([t,ico,label])=>`<button class="navbtn ${t===tab?'active':''}" data-tab="${t}"><span class="ico">${ico}</span>${label}</button>`).join('')}
function header(title,description){return `<div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">Cuaderno de campo</div><h1 style="font-size:29px;margin-top:7px">${title}</h1><p class="subtle">${description}</p></div></div>`}
function todayView(){const w=forecastAt(0),m=moon(TODAY()),r=recommendations();return `<section class="hero"><div class="inside"><div class="eyebrow">${safe(fmt(TODAY(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</div><h1>Hoy, en tu huerta.</h1><p>Las labores de cada día, con tiempo para preparar lo que viene.</p><p class="tiny">📍 ${safe(state.place)}${state.region?', '+safe(state.region):''}</p></div></section>${!state.configured?'<div class="notice">Completa los ajustes para personalizar tus cultivos y frutales. <button class="button ghost small" data-action="settings">Configurar ahora →</button></div>':''}
<div class="grid"><article class="card"><div class="eyebrow">Tiempo local · previsión</div><div class="mini-weather"><div><div class="temp">${w?Math.round(w.max)+'°':'—'}</div><div class="tiny subtle">${w?Math.round(w.min)+'° mín. · '+Math.round(w.rain)+' mm lluvia':'Sin conexión meteorológica'}</div></div><span style="font-size:36px">☁</span></div>${weatherError?`<p class="tiny price">${safe(weatherError)}</p>`:''}<button class="button ghost small" data-action="refresh">Actualizar clima ↻</button></article>
<article class="card"><div class="eyebrow">Luna · cálculo astronómico aproximado</div><div class="mini-weather"><div><h3>${m.label}</h3><p class="tiny subtle">Tradición: ${m.trad} · No es criterio agronómico probado.</p></div><span style="font-size:36px">${m.icon}</span></div></article></div>
<div class="sectionhead"><h2>Tu huerta, hoy</h2><button class="button ghost small" data-tab="huerta">Mi huerta →</button></div><div class="card">${state.plantings.length||state.trees.length?(mineToday().length?mineToday().map(a=>`<div class="action"><div class="dot">${a.icon}</div><div><strong>${a.title}</strong><p class="subtle compact">${a.body}</p></div></div>`).join(''):'<p class="subtle compact">Tus cultivos están registrados. Sin alertas específicas con los datos disponibles: revisa su humedad y estado.</p>'):'<div class="home-alert"><strong>Empieza registrando lo que ya tienes plantado.</strong><p class="compact">Así recibirás consejos para proteger plantaciones recientes, decidir cuándo revisar el riego y atender a tus frutales.</p><button class="button small" data-tab="huerta" style="margin-top:12px">Registrar cultivos y frutales →</button></div>'}</div><div class="sectionhead"><h2>Qué plantar hoy</h2></div><div class="card"><p class="compact">${!w?'Consulta la previsión antes de plantar.':danger(w)?'Hay condiciones meteorológicas que requieren precaución. Evita trasplantes delicados y confirma la previsión.':'El tiempo de hoy no presenta alertas generales en este modelo; comprueba además las heladas próximas y el estado del suelo.'}</p><div class="chips">${r.suitable.slice(0,5).map(c=>`<button class="chip" data-crop="${c.id}">${c.emoji} ${c.name}</button>`).join('')||'<p class="subtle">Sin opciones en el catálogo para esta temporada.</p>'}</div><p class="tiny subtle">Opciones estacionales, no garantía de aptitud para plantar hoy.</p></div><div class="sectionhead"><h2>Lo importante hoy</h2><span class="pill">${r.priorities.length} sugerencias</span></div><div class="card">${r.priorities.map(a=>`<div class="action"><div class="dot">${a.icon}</div><div><strong>${a.title}</strong><p class="subtle compact">${a.body}</p></div></div>`).join('')}</div>
<div class="sectionhead"><h2>Anticípate</h2><button class="button ghost small" data-tab="plan">Ver plan →</button></div><div class="card"><div class="eyebrow">Compra y prepara con días de margen</div>${r.shopping.length?r.shopping.map(x=>`<div class="action"><div class="dot">🧺</div><div><strong>${x.crop.name}: prepara plantel</strong><p class="compact">Posible trasplante: <b>${fmt(x.date,{weekday:'long',day:'numeric',month:'long'})}</b> (${x.offset} días). ${x.reason}</p><button class="button outline small" data-action="supply" data-value="${x.crop.id}">${state.supplies.includes(x.crop.id)?'✓ Ya lo tengo':'Marcar: ya lo tengo'}</button></div></div>`).join(''):'<p class="subtle">No se ha detectado una ventana segura de compra y trasplante para los próximos días con los criterios iniciales. Revisa la previsión y los cultivos.</p>'}<div class="notice tiny" style="margin-top:12px">La previsión meteorológica permite planificar hasta 16 días; el horizonte de 2–4 semanas es estacional y orientativo.</div></div>
<div class="sectionhead"><h2>Qué plantar ahora</h2><button class="button ghost small" data-tab="cultivos">Ver todos →</button></div><div class="grid3">${r.suitable.slice(0,6).map(c=>miniCrop(c)).join('')||'<div class="card">No hay cultivos del catálogo que encajen con esta selección.</div>'}</div>`}
function miniCrop(c){return `<div class="card cropcard"><span class="cropIcon">${c.emoji}</span><strong>${c.name}</strong><span class="tiny subtle">${c.seed}</span><button class="button outline small" data-crop="${c.id}">Ver ficha →</button></div>`}
function cropsView(){const suitable=recommendations().suitable;let list=filter==='ahora'?suitable:filter==='raiz'?C.filter(x=>x.kind==='raíz'):filter==='hoja'?C.filter(x=>x.kind==='hoja'):filter==='fruto'?C.filter(x=>x.kind==='fruto'):filter==='flor'?C.filter(x=>x.kind==='flor'):C;return `${header('Qué plantar','Selecciona un cultivo y consulta fechas orientativas, técnicas y asociaciones.')}<div class="chips">${[['todos','Todos'],['ahora','Ahora en mi zona'],['raiz','Raíz'],['hoja','Hoja'],['fruto','Fruto'],['flor','Flor']].map(([k,v])=>`<button class="chip ${filter===k?'on':''}" data-filter="${k}">${v}</button>`).join('')}</div><p class="subtle tiny" style="margin-bottom:13px">Las ventanas del catálogo son generales para clima mediterráneo. Ajusta por altitud, variedad, heladas y microclima.</p><div class="grid3">${list.map(c=>`<article class="card cropcard"><span class="cropIcon">${c.emoji}</span><strong>${c.name}</strong><span class="pill ${plantable(c)?'':'neutral'}">${plantable(c)?'En temporada orientativa':'Fuera de temporada'}</span><span class="tiny subtle">${safe(c.seed)}</span><button class="button outline small" data-crop="${c.id}">Ficha del cultivo</button></article>`).join('')}</div>`}
function planView(){const r=recommendations(),m=moon(TODAY()),next=Array.from({length:7},(_,i)=>({i,w:forecastAt(i),d:addDays(TODAY(),i)}));const monthly=addDays(TODAY(),28);return `${header('Plan de trabajo','Hoy, esta semana y las próximas cuatro semanas.')}<div class="card"><div class="eyebrow">Próximos siete días · previsión real si está disponible</div>${next.map(x=>{const tasks=[];if(!x.w)tasks.push('Consultar previsión actualizada antes de trabajos delicados.');else if(x.w.min<=2)tasks.push('Revisar protección frente a heladas; aplazar trasplantes sensibles.');else if(x.w.rain>=8)tasks.push('Comprobar drenaje, evitar pisar el suelo húmedo y revisar riego.');else if(x.w.wind>=35)tasks.push('Evitar poda y pulverizaciones por viento.');else tasks.push('Revisar semilleros, humedad y bancales preparados.');if(x.i===0)tasks.push('Comprobar acolchado y observar el estado de los cultivos.');if(x.i===3)tasks.push('Revisar existencias de plantel, compost y material de protección.');if(x.i===5)tasks.push('Planificar rotación y asociaciones de la siguiente plantación.');return `<div class="dayrow"><div><strong>${safe(fmt(x.d,{weekday:'short'}))}</strong><p class="tiny subtle">${fmt(x.d)}</p></div><div><div class="tiny subtle">${x.w?weatherSummary(x.w):'Previsión no disponible'}</div>${tasks.map((t,j)=>{const k=iso(x.d)+'-'+j;return `<label class="checkrow"><input type="checkbox" data-done="${k}" ${state.tasksDone[k]?'checked':''}><span class="compact">${t}</span></label>`}).join('')}</div></div>`}).join('')}</div>
<div class="sectionhead"><h2>Compras próximas</h2></div><div class="card">${r.shopping.length?r.shopping.map(x=>`<div class="action"><div class="dot">🧺</div><div><strong>${x.crop.name}</strong><p class="compact">Compra unos 3–5 días antes de ${fmt(x.date)} si la previsión se mantiene favorable.</p><button class="button outline small" data-action="supply" data-value="${x.crop.id}">${state.supplies.includes(x.crop.id)?'✓ Comprado':'Marcar comprado'}</button></div></div>`).join(''):'<p class="subtle">Sin compras prioritarias identificadas con la previsión disponible.</p>'}</div><div class="sectionhead"><h2>Mirada a cuatro semanas</h2></div><div class="card"><p>Hasta <b>${fmt(monthly,{day:'numeric',month:'long'})}</b>, revisa variedades de temporada, disponibilidad de semillas, rotaciones, abonado y zonas a cubrir.</p><p class="subtle compact">No se asignan fechas meteorológicas exactas más allá del alcance fiable de la previsión. El calendario lunar tradicional se usa solo como referencia opcional.</p><div class="divider"></div><strong>Mis frutales</strong>${state.trees.length?state.trees.map(t=>`<p class="compact">✂ ${safe(t.name)}: ${fruitAdvice(t).text}</p>`).join(''):'<p class="subtle compact">Añade tus árboles en «Mi huerta» para recibir orientación específica sobre la poda.</p>'}</div>`}
function gardenView(){return `${header('Mi huerta','Tu registro personal de plantaciones y frutales.')}<div class="stats"><div class="stat">🌱 ${state.plantings.length} plantaciones</div><div class="stat">🌳 ${state.trees.length} frutales</div><div class="stat">🧺 ${state.supplies.length} compras marcadas</div></div><div class="sectionhead"><h2>Mis cultivos</h2><button class="button small" data-action="addplant">+ Añadir</button></div><div class="card">${state.plantings.length?state.plantings.map(p=>`<div class="action"><div class="dot">🌱</div><div style="flex:1"><strong>${safe(p.name)}</strong><p class="tiny subtle">${safe(p.area||'Huerta')} · Plantado ${safe(p.date)}</p></div><button class="button ghost small" data-remove="plant:${p.id}" aria-label="Eliminar">✕</button></div>`).join(''):'<div class="empty">Registra qué has plantado para empezar tu cuaderno de campo.</div>'}</div><div class="sectionhead"><h2>Mis frutales</h2><button class="button small" data-action="addtree">+ Añadir</button></div><div class="card">${state.trees.length?state.trees.map(t=>`<div class="action"><div class="dot">🌳</div><div style="flex:1"><strong>${safe(t.name)}</strong><p class="tiny subtle">${safe(t.age||'Edad no indicada')} · Última poda: ${safe(t.last||'sin registrar')}</p><p class="compact">${safe(fruitAdvice(t).text)}</p></div><button class="button ghost small" data-remove="tree:${t.id}" aria-label="Eliminar">✕</button></div>`).join(''):'<div class="empty">Añade almendros, olivos, manzanos y otros árboles para planificar la poda.</div>'}</div><div class="sectionhead"><h2>Mis preferencias</h2></div><div class="card"><p><b>Localidad:</b> ${safe(state.place)}, ${safe(state.region)}</p><p><b>Espacios:</b> ${state.spaces.map(safe).join(', ')}</p><p><b>Riego:</b> ${safe(state.irrigation)}</p><p><b>Suelo:</b> ${safe(state.soil)}</p><button class="button outline small" style="margin-top:12px" data-action="settings">Editar configuración</button></div>`}
function photoView(){return `${header('Observa tus plantas','Prepara una consulta fotográfica sobre el estado de tus cultivos o la poda.')}<div class="card stack"><div class="notice"><strong>Versión inicial:</strong> permite adjuntar y visualizar imágenes, pero el diagnóstico visual con IA todavía no está conectado. No se analizarán ni enviarán fotografías a ningún servicio.</div><label class="label">Fotografía de la planta o árbol</label><input type="file" id="photoInput" class="field" accept="image/*" capture="environment"><div id="photoPreview">${photoData?`<img class="photo" src="${photoData}" alt="Fotografía seleccionada">`:'<div class="empty">📷 Tu foto aparecerá aquí.</div>'}</div><label class="label" for="photoQuestion">¿Qué quieres consultar?</label><textarea id="photoQuestion" class="field" placeholder="Ejemplo: las hojas del limonero amarillean, ¿qué debería observar?"></textarea><button class="button" data-action="photoExplain">Preparar consulta</button><p class="tiny subtle">Para activar el análisis real necesitaremos un servidor que conecte con un modelo de visión y proteja la clave de acceso. Ningún diagnóstico se considerará concluyente sin verificación.</p></div>`}
function settingsView(){const spaces=[['exterior','Huerta al aire libre'],['invernadero','Invernadero'],['bancal','Bancales elevados'],['maceta','Macetas y terraza']];return `${header('Configura tu huerta','Personaliza el entorno para que las recomendaciones sean útiles.')}<form id="settingsForm" class="card stack"><div><label class="label">Tu dispositivo</label><select class="field" name="device"><option value="ios" ${state.device==='ios'?'selected':''}>iPhone / iOS</option><option value="android" ${state.device==='android'?'selected':''}>Android</option></select></div><div><label class="label">Localidad española</label><div class="flex"><input id="locationSearch" class="field" value="${safe(state.place)}" placeholder="Busca tu municipio"><button class="button small" type="button" data-action="searchloc">Buscar</button></div><div id="locationResults" class="tiny subtle" style="margin-top:8px">Localidad seleccionada: ${safe(state.place)}, ${safe(state.region)}.</div></div><div><label class="label">Espacios de cultivo</label>${spaces.map(([val,name])=>`<label class="checkrow"><input type="checkbox" name="spaces" value="${val}" ${state.spaces.includes(val)?'checked':''}>${name}</label>`).join('')}</div><div class="two"><div><label class="label">Riego</label><select name="irrigation" class="field">${['goteo','aspersión','manual','sin instalación'].map(x=>`<option ${state.irrigation===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Suelo</label><select name="soil" class="field">${['desconocido','arcilloso','arenoso','franco'].map(x=>`<option ${state.soil===x?'selected':''}>${x}</option>`).join('')}</select></div></div><button class="button" type="submit">Guardar mi huerta</button></form><div class="card" style="margin-top:14px"><h3>Avisos</h3><p class="compact subtle">En esta versión se muestran recordatorios al abrir la aplicación. Los avisos push con la aplicación cerrada requieren servidor y despliegue HTTPS.</p><button class="button outline small" data-action="permission" style="margin-top:11px">${state.notifications?'Permiso solicitado':'Solicitar permiso de notificaciones'}</button></div><div class="card" style="margin-top:14px"><h3>Mis datos</h3><p class="compact subtle">Las plantaciones, frutales y preferencias se guardan en este navegador; no se sincronizan entre teléfonos.</p><button class="button outline small" data-action="export">Exportar datos JSON</button></div>`}
function showModal(inner){document.getElementById('modalroot').innerHTML=`<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true"><div class="spread" style="margin-bottom:13px"><span class="eyebrow">Raíz Lunar</span><button class="button ghost small" data-action="close">Cerrar ✕</button></div>${inner}</div></div>`;}
function cropModal(c){showModal(`<div class="previewIcon">${c.emoji}</div><h2>${c.name}</h2><p class="subtle">${c.kind} · ${plantable(c)?'En temporada orientativa':'Fuera de temporada orientativa'}</p><div class="divider"></div><div class="stack compact"><p><b>Época general:</b> ${c.months.map(monthName).join(', ')}</p><p><b>Siembra o trasplante:</b> ${safe(c.seed)}</p><p><b>Profundidad:</b> ${safe(c.depth)}</p><p><b>Marco:</b> ${safe(c.space)}</p><p><b>Riego:</b> ${safe(c.water)}</p><p><b>Asociaciones orientativas:</b> ${safe(c.comp)}</p><p><b>Suelo vivo:</b> ${safe(c.tip)}</p><p><b>Precaución local:</b> comprobar heladas, variedad y estado del suelo antes de plantar.</p></div><button class="button" style="margin-top:17px;width:100%" data-action="addplant" data-value="${c.id}">+ Registrar plantación</button>`)}
function addPlantModal(c=''){showModal(`<h2>Nueva plantación</h2><form id="plantForm" class="stack" style="margin-top:15px"><div><label class="label">Cultivo</label><select class="field" name="crop">${C.map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${x.name}</option>`).join('')}</select></div><div><label class="label">Bancal o ubicación</label><input class="field" name="area" placeholder="Ejemplo: bancal 1 / invernadero"></div><div><label class="label">Fecha de plantación</label><input type="date" name="date" class="field" value="${iso(TODAY())}"></div><button class="button" type="submit">Guardar plantación</button></form>`)}
function addTreeModal(){showModal(`<h2>Nuevo árbol frutal</h2><form id="treeForm" class="stack" style="margin-top:15px"><div><label class="label">Especie</label><select name="name" class="field">${FRUIT.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label class="label">Edad aproximada</label><input name="age" class="field" placeholder="Ej.: 5 años / adulto"></div><div><label class="label">Última poda (opcional)</label><input name="last" class="field" type="date"></div><button class="button" type="submit">Guardar árbol</button></form>`)}
function toast(s){const el=document.getElementById('toastroot');el.innerHTML=`<div class="toast" role="status">${safe(s)}</div>`;setTimeout(()=>{el.innerHTML=''},4000)}
function render(){nav();document.querySelector('.tabbar').classList.toggle('hide',!state.entered);document.getElementById('settingsBtn').classList.toggle('hide',!state.entered);if(!state.entered){document.getElementById('app').innerHTML=welcomeView();return}let views={inicio:todayView,cultivos:cropsView,plan:planView,foto:photoView,huerta:gardenView,settings:settingsView};document.getElementById('app').innerHTML=(views[tab]||todayView)();}
function navigate(s){tab=s;render();window.scrollTo({top:0,behavior:'instant'})}
function supply(c){state.supplies=state.supplies.includes(c)?state.supplies.filter(x=>x!==c):[...state.supplies,c];save();render();}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`raiz-lunar-${iso(TODAY())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function interaction(e){let el=e.target.closest('[data-tab],[data-action],[data-crop],[data-filter],[data-remove],[data-loc]');if(!el)return;if(el.dataset.tab){navigate(el.dataset.tab);return}if(el.dataset.crop){cropModal(C.find(x=>x.id===el.dataset.crop));return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.loc!==undefined){const x=locResults[Number(el.dataset.loc)];if(x){state.place=x.name;state.region=x.admin1||'';state.lat=x.latitude;state.lon=x.longitude;state.timezone=x.timezone||'Europe/Madrid';save();document.getElementById('locationResults').innerHTML=`✓ Seleccionado: ${safe(x.name)}, ${safe(x.admin1||'')}`;document.getElementById('locationSearch').value=x.name;toast('Localidad seleccionada. Guarda la configuración.')}return}
if(el.dataset.remove){let [type,key]=el.dataset.remove.split(':');if(!confirm('¿Eliminar este registro?'))return;if(type==='plant')state.plantings=state.plantings.filter(x=>x.id!==key);else state.trees=state.trees.filter(x=>x.id!==key);save();render();return}
switch(el.dataset.action){case 'enterGarden':state.entered=true;state.configured=true;save();navigate('inicio');loadWeather();break;case 'refresh':loadWeather();toast('Consultando previsión...');break;case 'settings':navigate('settings');break;case 'searchloc':findPlace(document.getElementById('locationSearch').value);break;case 'supply':supply(el.dataset.value);break;case 'addplant':addPlantModal(el.dataset.value);break;case 'addtree':addTreeModal();break;case 'close':document.getElementById('modalroot').innerHTML='';break;case 'photoExplain':toast('Fotografía preparada. El análisis real con IA todavía no está conectado.');break;case 'export':exportData();break;case 'permission':if(!('Notification'in window)){toast('Este navegador no dispone de notificaciones web.');break}Notification.requestPermission().then(v=>{state.notifications=v==='granted';save();toast(v==='granted'?'Permiso concedido. Falta configurar el servidor para envíos automáticos.':'Notificaciones no autorizadas.');render()});break;}}
document.addEventListener('click',interaction);document.getElementById('settingsBtn').addEventListener('click',()=>navigate('settings'));document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){state.tasksDone[e.target.dataset.done]=e.target.checked;save()}if(e.target.id==='photoInput'){const f=e.target.files?.[0];if(!f)return;if(f.size>8_000_000){toast('Usa una foto de menos de 8 MB.');return}const rdr=new FileReader();rdr.onload=()=>{photoData=rdr.result;document.getElementById('photoPreview').innerHTML=`<img class="photo" alt="Fotografía seleccionada" src="${photoData}">`};rdr.readAsDataURL(f)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='settingsForm'){let f=new FormData(e.target),sp=f.getAll('spaces');state.device=f.get('device');state.spaces=sp.length?sp:['exterior'];state.irrigation=f.get('irrigation');state.soil=f.get('soil');state.configured=true;save();navigate('inicio');loadWeather();toast('Configuración guardada.');}if(e.target.id==='plantForm'){let f=new FormData(e.target),c=C.find(x=>x.id===f.get('crop'));state.plantings.push({id:id(),name:c.name,crop:c.id,area:String(f.get('area')),date:String(f.get('date'))});save();document.getElementById('modalroot').innerHTML='';navigate('inicio');toast('Plantación registrada y guardada.')}if(e.target.id==='treeForm'){let f=new FormData(e.target);state.trees.push({id:id(),name:String(f.get('name')),age:String(f.get('age')),last:String(f.get('last'))});save();document.getElementById('modalroot').innerHTML='';navigate('inicio');toast('Frutal registrado y guardado.')}});
document.addEventListener('click',e=>{if(e.target.matches('[data-close]'))document.getElementById('modalroot').innerHTML=''});
render();loadWeather();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
